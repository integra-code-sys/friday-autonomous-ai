<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>F.R.I.D.A.Y. · Navegador</title>
<style>
  :root { --hot:#ff8a1f; --holo:#8fe9ff; --bg:#050505; --fg:#ffffff; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:15px/1.4 "Inter","Noto Sans",sans-serif; overflow:hidden; }
  body::before { content:""; position:fixed; inset:0; pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(143,233,255,.05) 0 1px,transparent 1px 4px); }
  #plexo { position:fixed; inset:0; z-index:0; }
  main { position:relative; z-index:1; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px;
    animation:entra .7s cubic-bezier(.2,1.4,.4,1); }
  @keyframes entra { from { opacity:0; transform:scale(.6); filter:blur(8px); } to { opacity:1; transform:none; filter:none; } }
  h1 { margin:0; font-weight:700; letter-spacing:.6em; font-size:22px; }
  h1 small { display:block; color:var(--hot); font-size:11px; letter-spacing:.5em; margin-top:8px; font-weight:400; }
  form { width:min(720px,90vw); position:relative; }
  input { width:100%; padding:16px 22px; background:rgba(0,0,0,.75); color:var(--fg); font-size:18px; outline:none;
    border:1px solid var(--hot); border-radius:2px; box-shadow:0 0 24px rgba(255,138,31,.25) inset, 0 0 18px rgba(143,233,255,.15); }
  input:focus { border-color:var(--fg); }
  form::after { content:""; position:absolute; left:0; bottom:-1px; height:2px; width:100%; background:var(--holo);
    animation:varre 2.4s ease-in-out infinite; transform-origin:left; }
  @keyframes varre { 0%{transform:scaleX(0)} 50%{transform:scaleX(1)} 100%{transform:scaleX(0);transform-origin:right} }
  .tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:14px; width:min(720px,90vw); }
  .tiles a { display:block; padding:16px 12px; text-align:center; color:var(--holo); text-decoration:none; letter-spacing:.2em; font-size:12px;
    border:1px solid rgba(143,233,255,.35); background:rgba(143,233,255,.04); position:relative; transition:.2s; }
  .tiles a::before,.tiles a::after { content:""; position:absolute; width:10px; height:10px; border:2px solid var(--fg); }
  .tiles a::before { top:-1px; left:-1px; border-right:0; border-bottom:0; }
  .tiles a::after { bottom:-1px; right:-1px; border-left:0; border-top:0; }
  .tiles a:hover { color:var(--fg); border-color:var(--hot); background:rgba(255,138,31,.1); }
  footer { position:fixed; bottom:12px; left:0; right:0; text-align:center; color:var(--hot); font-size:11px; letter-spacing:.4em; z-index:1; }
</style>
</head>
<body>
<canvas id="plexo"></canvas>
<main>
  <h1>F.R.I.D.A.Y.<small>NAVEGADOR HOLOGRÁFICO</small></h1>
  <form id="f"><input id="q" autofocus placeholder="Pesquisar ou digitar endereço" autocomplete="off"></form>
  <div class="tiles">
    <a href="https://www.google.com">GOOGLE</a><a href="https://www.youtube.com">YOUTUBE</a>
    <a href="https://mail.google.com">GMAIL</a><a href="https://github.com">GITHUB</a>
    <a href="https://web.whatsapp.com">WHATSAPP</a><a href="https://claude.ai">CLAUDE</a>
  </div>
</main>
<footer id="hora"></footer>
<script>
  const ir = v => { v = v.trim(); if (!v) return;
    location.href = /^[\w.-]+\.[a-z]{2,}(\/.*)?$/i.test(v) ? (v.startsWith("http") ? v : "https://" + v) : "https://www.google.com/search?q=" + encodeURIComponent(v); };
  document.getElementById("f").onsubmit = e => { e.preventDefault(); ir(document.getElementById("q").value); };
  const p = new URLSearchParams(location.search);
  if (p.get("u")) setTimeout(() => ir(p.get("u")), 900); else if (p.get("q")) setTimeout(() => ir(p.get("q")), 900);
  setInterval(() => document.getElementById("hora").textContent = "SISTEMAS ONLINE · " + new Date().toLocaleTimeString("pt-BR"), 1000);
  // fundo: plexo de partículas (linhas com pontos nas pontas)
  const c = document.getElementById("plexo"), x = c.getContext("2d"); let W, H;
  const rs = () => { W = c.width = innerWidth; H = c.height = innerHeight; }; rs(); addEventListener("resize", rs);
  const P = Array.from({length: 70}, () => ({x: Math.random(), y: Math.random(), vx: (Math.random() - .5) * .0006, vy: (Math.random() - .5) * .0006}));
  (function f() { x.clearRect(0, 0, W, H);
    for (const a of P) { a.x = (a.x + a.vx + 1) % 1; a.y = (a.y + a.vy + 1) % 1; }
    for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) {
      const dx = (P[i].x - P[j].x) * W, dy = (P[i].y - P[j].y) * H, d = Math.hypot(dx, dy);
      if (d < 150) { x.strokeStyle = `rgba(143,233,255,${(1 - d / 150) * .35})`; x.beginPath(); x.moveTo(P[i].x * W, P[i].y * H); x.lineTo(P[j].x * W, P[j].y * H); x.stroke(); } }
    P.forEach((a, i) => { x.fillStyle = i % 9 ? "rgba(190,245,255,.8)" : "#ff8a1f"; x.beginPath(); x.arc(a.x * W, a.y * H, 2, 0, 7); x.fill(); });
    requestAnimationFrame(f); })();
</script>
</body>
</html>
